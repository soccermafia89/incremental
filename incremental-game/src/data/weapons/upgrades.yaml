# Weapons tab, after that weapon is bought. Cost doubles each level.
# Laser range starts at the laser part's range. Each step adds one stock-gun of reach.
# Energy reduction lowers the laser's draw by 1, from 4 down to free.
# Missile damage starts at 30. Fire rate 1 waits baseMs. Each rate step shortens that wait.
laserRange:
  start: 270
  step: 90
  max: 540
  cost: 2000
laserEnergy:
  start: 0
  step: 1
  max: 4
  cost: 2000
# The cannon comes with the designer. Rate 1 waits baseMs. Each rate step shortens that wait.
# Cannon damage starts at designer.weaponDamage.
cannonFireRate:
  start: 1
  step: 1
  max: 4
  cost: 2000
  baseMs: 1000
cannonDamage:
  start: 10
  step: 10
  max: 40
  cost: 2000
missileFireRate:
  start: 1
  step: 1
  max: 4
  cost: 4000
  # Milliseconds between shots of one missile at rate 1. Higher rates divide this.
  baseMs: 5000
missileDamage:
  start: 30
  step: 10
  max: 40
  cost: 4000
