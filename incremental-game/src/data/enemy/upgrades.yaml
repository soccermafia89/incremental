# How fast destroyed enemy miners return. Rate 1 is replenishMs.
# Each purchase doubles the rate, so the wait halves. Max is the last of those rates.
# The first purchase costs `cost`, then the price doubles. bounty 1 leaves the payout unchanged.
spawnRate:
  start: 1
  step: 1
  max: 128
  cost: 20
  bounty: 1
# The first purchase sets the fleet cap to `start`. Each later purchase adds `step`.
# Before any purchase the cap starts at 1, then the miner and golden bonuses multiply it.
# The first purchase costs `cost`, then the price doubles.
# Each purchase also multiplies destroyed-ship payout by `bounty`. Those factors compound.
capacity:
  start: 10
  step: 5
  max: 30
  cost: 5
  bounty: 1.3
# Rival ship health. Start matches ships.health. Each purchase also multiplies the bounty.
health:
  start: 20
  step: 10
  max: 60
  cost: 20
  bounty: 1.3
# Rival shot damage before golden asteroids. Golden still scales this.
damage:
  start: 1
  step: 1
  max: 10
  cost: 20
  bounty: 1.3
# Rate 1 is one shot every 4 seconds, four times ships.shotIntervalMs. Higher rates shorten it. Golden still speeds it up.
attackRate:
  start: 1
  step: 1
  max: 4
  cost: 20
  bounty: 1.3
