# How fast destroyed enemy miners return. Rate 1 is replenishMs. Cost doubles each level.
# bounty 1 leaves the payout for a destroyed ship unchanged.
spawnRate:
  start: 1
  step: 1
  max: 8
  cost: 1
  bounty: 1
# The first purchase sets the fleet cap to `start`. Each later purchase adds `step`.
# Before any purchase the cap starts at 1, then the miner and golden bonuses multiply it.
# Each purchase also multiplies destroyed-ship payout by `bounty`. Those factors compound.
capacity:
  start: 10
  step: 5
  max: 30
  cost: 1
  bounty: 1.3
# Rival ship health. Start matches ships.health. Each purchase also multiplies the bounty.
health:
  start: 20
  step: 10
  max: 60
  cost: 20
  bounty: 1.3
# Rival shot damage before golden asteroids. Golden still scales this.
damage:
  start: 1
  step: 1
  max: 10
  cost: 20
  bounty: 1.3
# Rate 1 is one shot per shotIntervalMs. Higher rates shorten it. Golden still speeds it up.
attackRate:
  start: 1
  step: 1
  max: 5
  cost: 20
  bounty: 1.3
