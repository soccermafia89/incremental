# Unlock for the Ship Designer sidebar. Paid once.
cost: 2000
# Cells you can build out from the core, on each side. The core sits at (0, 0).
half: 10
# Sides of the core that a part can bolt onto. The core has weight, health, and no thrust.
# Structural blocks add health. Armor is a 2x2 block with much more health and a higher build cost.
# Speed is thrust divided by weight. Every part consumes energy.
# Energy parts grant more than one part uses. A negative energy value is consumption.
# A built design moves at its speed times ships.speed. Each shot deals this damage.
# Each gun type keeps its own timer. Extra guns of that type shorten its wait.
weaponDamage: 10
# Bought on Ship Upgrades once the designer is owned. The part then joins the catalog.
# The stock gun is free with the designer. Its range matches ships.weaponRange.
weapons:
  laser:
    cost: 4000
  missile:
    cost: 12000
# Bought on Ship Upgrades once the designer is owned. The stock thruster is free.
# A bigger engine covers more cells, draws more energy, and pushes harder.
engines:
  mediumEngine:
    cost: 5000
  largeEngine:
    cost: 15000
core:
  weight: 2
  health: 20
  mounts: [n, e, s, w]
# Local (0, 0) is the square the click places. A mount is one side of one of the
# part's squares. It bolts on when that side touches the opposite mount of a square
# already connected to the core.
components:
  structural:
    label: Structural
    # Production units to build one. Same units as a fighter, which costs 1000.
    units: 10
    weight: 1
    thrust: 0
    energy: -1
    health: 20
    range: 0
    color: "#94a3b8"
    cells:
      - [0, 0]
    mounts:
      - [0, 0, n]
      - [0, 0, e]
      - [0, 0, s]
      - [0, 0, w]
  armor:
    label: Armor
    # Four structural blocks are 80 health and 40 units. This slab is much tougher and costs more to build.
    units: 120
    weight: 8
    thrust: 0
    energy: -4
    health: 200
    range: 0
    color: "#818cf8"
    cells:
      - [0, 0]
      - [1, 0]
      - [0, 1]
      - [1, 1]
    mounts:
      - [0, 0, n]
      - [0, 0, e]
      - [0, 0, s]
      - [0, 0, w]
      - [1, 0, n]
      - [1, 0, e]
      - [1, 0, s]
      - [1, 0, w]
      - [0, 1, n]
      - [0, 1, e]
      - [0, 1, s]
      - [0, 1, w]
      - [1, 1, n]
      - [1, 1, e]
      - [1, 1, s]
      - [1, 1, w]
  weapon:
    label: Cannon
    units: 50
    weight: 2
    thrust: 0
    energy: -1
    health: 0
    # Short range. The same reach as ships.weaponRange.
    range: 90
    color: "#f87171"
    # Barrel points up. The south side of the breech is the only mount.
    cells:
      - [0, 0]
      - [0, -1]
    mounts:
      - [0, 0, s]
  laser:
    label: Laser
    units: 60
    weight: 2
    thrust: 0
    # One energy block. A thruster on the same block leaves the laser dark.
    energy: -4
    health: 0
    # Three times the stock gun.
    range: 270
    color: "#22d3ee"
    # Four cells tall and one wide. Barrel points up. The south side of the breech is the only mount.
    cells:
      - [0, 0]
      - [0, -1]
      - [0, -2]
      - [0, -3]
    mounts:
      - [0, 0, s]
  missile:
    label: Missile
    # Eight stock guns. The unlock on Ship Upgrades is expensive as well.
    # A hit also deals half damage to enemy ships in the round blast, about three and a half cells out.
    units: 400
    weight: 2
    thrust: 0
    energy: -1
    health: 0
    # Twice the stock gun, short of the laser.
    range: 180
    color: "#e879f9"
    # Two by two. Barrel points up. The south side of the breech row bolts on.
    cells:
      - [0, 0]
      - [1, 0]
      - [0, -1]
      - [1, -1]
    mounts:
      - [0, 0, s]
      - [1, 0, s]
  thruster:
    label: Thruster
    units: 25
    weight: 1
    thrust: 8
    energy: -1
    health: 0
    range: 0
    color: "#fb923c"
    cells:
      - [0, 0]
    mounts:
      - [0, 0, n]
  mediumEngine:
    label: Medium engine
    units: 80
    weight: 3
    thrust: 20
    # A whole energy block. A stock thruster draws 1.
    energy: -4
    health: 0
    range: 0
    color: "#fdba74"
    cells:
      - [0, 0]
      - [1, 0]
    mounts:
      - [0, 0, n]
      - [0, 0, e]
      - [0, 0, s]
      - [0, 0, w]
      - [1, 0, n]
      - [1, 0, e]
      - [1, 0, s]
      - [1, 0, w]
  largeEngine:
    label: Large engine
    units: 240
    weight: 10
    thrust: 50
    energy: -10
    health: 0
    range: 0
    color: "#c2410c"
    # Two cells wide and three tall.
    cells:
      - [0, 0]
      - [1, 0]
      - [0, 1]
      - [1, 1]
      - [0, 2]
      - [1, 2]
    mounts:
      - [0, 0, n]
      - [0, 0, e]
      - [0, 0, s]
      - [0, 0, w]
      - [1, 0, n]
      - [1, 0, e]
      - [1, 0, s]
      - [1, 0, w]
      - [0, 1, n]
      - [0, 1, e]
      - [0, 1, s]
      - [0, 1, w]
      - [1, 1, n]
      - [1, 1, e]
      - [1, 1, s]
      - [1, 1, w]
      - [0, 2, n]
      - [0, 2, e]
      - [0, 2, s]
      - [0, 2, w]
      - [1, 2, n]
      - [1, 2, e]
      - [1, 2, s]
      - [1, 2, w]
  energy:
    label: Energy
    units: 40
    weight: 1
    thrust: 0
    energy: 4
    health: 0
    range: 0
    color: "#facc15"
    # Both squares mount on every side, the same way a structural square does.
    cells:
      - [0, 0]
      - [0, 1]
    mounts:
      - [0, 0, n]
      - [0, 0, e]
      - [0, 0, s]
      - [0, 0, w]
      - [0, 1, n]
      - [0, 1, e]
      - [0, 1, s]
      - [0, 1, w]
  # The prebuilt miner only. Not sold, and not a gun the designer can bolt on.
  # Its shot is drawn as a yellow beam. Reach and damage stay on the miner upgrades.
  minerLaser:
    label: Miner laser
    units: 1
    weight: 1
    thrust: 0
    energy: 0
    health: 0
    range: 0
    color: "#fef08a"
    cells:
      - [0, 0]
      - [0, -1]
    mounts:
      - [0, 0, s]
